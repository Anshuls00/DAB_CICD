bundle:
  name: dab-cicd-bundle

sync:
  include:
    - "*.ipynb"        # include all notebooks at repo root
    # - notebooks/*.ipynb  # (optional) in case you later organize under /notebooks
  exclude:
    - .gitignore
    - README.md
    - .github/**       # exclude GitHub workflows

targets:
  dev:
    mode: development
    workspace:
      file_path: /Shared/DAB_CICD   # target folder inside Databricks workspace
  uat:
    mode: production
    workspace:
      file_path: /Shared/DAB_CICD
