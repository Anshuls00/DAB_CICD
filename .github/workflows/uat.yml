name: Databricks Asset Bundle - CICD

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10.12'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Bundle
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        echo "$HOME/.databricks/bin" >> $GITHUB_PATH

    - name: Configure Databricks CLI for Dev
      run: |
        databricks configure --host https://adb-831014617002513.13.azuredatabricks.net --token ${{ secrets.DATABRICKS_DEV_TOKEN }}

    - name: Validate bundle
      run: databricks bundle validate --target dev

  deploy-uat:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy to UAT
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        echo "$HOME/.databricks/bin" >> $GITHUB_PATH

    - name: Configure Databricks CLI for UAT
      run: |
        databricks configure --host https://adb-1375573820735468.8.azuredatabricks.net --token ${{ secrets.DATABRICKS_UAT_TOKEN }}

    - name: Deploy to UAT
      run: databricks bundle deploy --target uat

    - name: Deployment Summary
      run: |
        echo "🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
        echo "UAT Workspace: https://adb-1375573820735468.8.azuredatabricks.net" >> $GITHUB_STEP_SUMMARY
