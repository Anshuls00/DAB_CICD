name: Databricks Asset Bundle - CICD (UAT Only)

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: https://adb-1375573820735468.8.azuredatabricks.net

permissions:
  id-token: write
  contents: read

jobs:
  deploy-uat:
    runs-on: self-hosted
    name: Validate and Deploy Bundle to UAT
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure Login using Managed Identity
      - name: Azure login
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      # Install Databricks CLI and Bundle (PowerShell)
      - name: Install Databricks CLI and Bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh -OutFile install-databricks-cli.sh
          bash install-databricks-cli.sh
          pip install wheel

      # Install uv (PowerShell)
      - name: Install uv
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://astral.sh/uv/install.sh -OutFile install-uv.sh
          bash install-uv.sh
          $env:PATH = "$HOME\.cargo\bin;$env:PATH"

      # Validate the bundle (UAT)
      - name: Validate bundle (UAT)
        shell: pwsh
        run: databricks bundle validate --target uat

      # Deploy the bundle (UAT)
      - name: Deploy bundle (UAT)
        shell: pwsh
        run: databricks bundle deploy --target uat

      # Deployment summary
      - name: Deployment Summary
        shell: pwsh
        run: |
          echo "🚀 Deployment to UAT Complete!" >> $env:GITHUB_STEP_SUMMARY
          echo "UAT Workspace: $env:DATABRICKS_HOST" >> $env:GITHUB_STEP_SUMMARY
