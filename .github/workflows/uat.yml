name: Databricks Asset Bundle - CICD

on:
  workflow_dispatch:

env:
  DATABRICKS_CONFIG_PROFILE: CICD

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Databricks CLI (new version with bundle support)
      - name: Install Databricks CLI
        shell: powershell
        run: |
          $version = "v0.221.0"
          Write-Host "Installing Databricks CLI $version..."
          $url = "https://github.com/databricks/cli/releases/download/$version/databricks_cli_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile databricks_cli.zip
          Expand-Archive databricks_cli.zip -DestinationPath "$env:USERPROFILE\databricks" -Force
          echo "$env:USERPROFILE\databricks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Databricks CLI installed successfully."
          databricks version

      # Authenticate to Azure using OIDC (Managed Identity / Federated credentials)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Validate bundle against UAT target
      - name: Validate Databricks Bundle
        shell: powershell
        run: |
          databricks bundle validate --target uat

      # Deploy bundle to UAT target
      - name: Deploy Databricks Bundle
        shell: powershell
        run: |
          databricks bundle deploy --target uat
