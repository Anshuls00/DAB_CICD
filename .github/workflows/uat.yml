name: Databricks Asset Bundle - CICD (UAT Only)

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10.11'
  DATABRICKS_HOST: https://adb-1375573820735468.8.azuredatabricks.net

permissions:
  id-token: write
  contents: read

jobs:
  deploy-uat:
    runs-on: self-hosted   # Your self-hosted runner label
    name: Validate and Deploy Bundle to UAT
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install Databricks CLI
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> $GITHUB_PATH

      # Azure Login using Managed Identity
      - name: Azure login
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      # Configure Databricks CLI to use Azure CLI auth
      - name: Configure Databricks CLI
        run: |
          databricks configure --host $DATABRICKS_HOST --auth-type azure-cli

      # Test Authentication
      - name: Test Authentication (UAT)
        run: databricks workspace list /

      # Validate bundle
      - name: Validate bundle (UAT)
        run: databricks bundle validate --target uat

      # Deploy bundle
      - name: Deploy bundle (UAT)
        run: databricks bundle deploy --target uat

      # Deployment summary
      - name: Deployment Summary
        run: |
          echo "🚀 Deployment to UAT Complete!" >> $GITHUB_STEP_SUMMARY
          echo "UAT Workspace: $DATABRICKS_HOST" >> $GITHUB_STEP_SUMMARY
