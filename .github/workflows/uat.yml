name: Databricks Asset Bundle - CICD

on:
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.10.12'

jobs:
  # Job 1: Validate bundle configuration
  validate:
    runs-on: ubuntu-latest
    name: Validate Bundle
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        echo "$HOME/.databricks/bin" >> $GITHUB_PATH

    - name: Configure Databricks CLI for Dev
      run: |
        TOKEN=$(echo "${{ secrets.DATABRICKS_DEV_TOKEN }}" | tr -d '\n\r' | xargs)
        
        mkdir -p ~/.databricks
        cat > ~/.databrickscfg << EOF
[DEFAULT]
host = https://adb-831014617002513.13.azuredatabricks.net
token = $TOKEN
EOF
        
        databricks current-user me

    - name: Validate bundle
      run: databricks bundle validate --target dev

  # Job 2: Deploy to UAT
  deploy-uat:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy to UAT
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        echo "$HOME/.databricks/bin" >> $GITHUB_PATH

    - name: Configure Databricks CLI for UAT
      run: |
        TOKEN=$(echo "${{ secrets.DATABRICKS_UAT_TOKEN }}" | tr -d '\n\r' | xargs)
        
        mkdir -p ~/.databricks
        cat > ~/.databrickscfg << EOF
[DEFAULT]
host = https://adb-1375573820735468.8.azuredatabricks.net
token = $TOKEN
EOF
        
        databricks current-user me

    - name: Deploy to UAT
      run: databricks bundle deploy --target uat

    - name: Deployment Summary
      run: |
        echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **UAT Workspace**: https://adb-1375573820735468.8.azuredatabricks.net" >> $GITHUB_STEP_SUMMARY
        echo "- **Path**: /Shared/DAB_CICD" >> $GITHUB_STEP_SUMMARY
