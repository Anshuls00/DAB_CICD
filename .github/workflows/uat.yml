name: Databricks Asset Bundle - CICD (UAT Only)

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: https://adb-1375573820735468.8.azuredatabricks.net

permissions:
  id-token: write
  contents: read

jobs:
  deploy-uat:
    runs-on: self-hosted
    name: Validate and Deploy Bundle to UAT
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure Login using Managed Identity
      - name: Azure login
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      # Verify Databricks CLI is available
      - name: Check Databricks CLI
        run: databricks --version

      # Test Authentication directly with environment variables
      - name: Test Authentication (UAT)
        run: databricks workspace list /
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli

      # Validate bundle
      - name: Validate bundle (UAT)
        run: databricks bundle validate --target uat
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli

      # Deploy bundle
      - name: Deploy bundle (UAT)
        run: databricks bundle deploy --target uat
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli

      # Deployment summary
      - name: Deployment Summary
        shell: powershell
        run: |
          echo "🚀 Deployment to UAT Complete!" >> $env:GITHUB_STEP_SUMMARY
          echo "UAT Workspace: ${{ env.DATABRICKS_HOST }}" >> $env:GITHUB_STEP_SUMMARY
